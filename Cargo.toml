[package]
name = "jobsense-parker"
version = "0.4.0"
edition = "2021"
description = "A CLI job crawler that hunts the internet for hiring posts matching your resume — because LinkedIn sucks."
license = "MIT"
repository = "https://github.com/arpanpathak/jobsense-parker"
homepage = "https://github.com/arpanpathak/jobsense-parker"
keywords = ["jobs", "job-search", "crawler", "cli", "resume"]
categories = ["command-line-utilities", "web-programming::http-client"]
default-run = "jobsense-parker"

[[bin]]
name = "jobsense-parker"
path = "src/main.rs"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# Filesystem directories
dirs-next = "2"

# HTTP client (rustls — pure Rust TLS, so the CLI cross-compiles cleanly
# without a system OpenSSL and stays dependency-free for end users)
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "http2", "charset"] }

# HTML parsing
scraper = "0.21"

# CLI interaction
dialoguer = { version = "0.11", features = ["fuzzy-select"] }
indicatif = "0.17"
console = "0.15"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

# Output styling
colored = "2"

# Date/time
chrono = { version = "0.4", features = ["serde"] }

# Text matching
regex = "1"
strsim = "0.11"

# Error handling
thiserror = "2"
anyhow = "1"

# Random (for user-agent rotation)
rand = "0.8"

# Unique IDs
uuid = { version = "1", features = ["v4"] }

# Async trait support
async-trait = "0.1"

# Async concurrency utilities
futures = "0.3"

# PDF text extraction
pdf-extract = "0.12"

# Browser automation (CDP-based, no chromedriver needed)
headless_chrome = "1.0"
