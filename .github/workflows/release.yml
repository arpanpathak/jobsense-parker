# ─────────────────────────────────────────────────────────────────────────────
# GitHub Actions: Cross-platform release build
#
# Trigger: push of a `v*` tag (e.g. `v0.3.0`)
#
# Builds optimised binaries for macOS (x86_64 + arm64), Linux (x86_64 + arm64)
# and Windows (x86_64), archives them, and attaches them to the GitHub Release
# created for the tag. `install.sh` / `install.ps1` download these archives.
#
# To create a release:
#   git tag v0.3.0 && git push origin v0.3.0
# ─────────────────────────────────────────────────────────────────────────────

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-apple-darwin
            os: macos-13
            archive: tar.gz
          - target: aarch64-apple-darwin
            os: macos-14
            archive: tar.gz
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
            zigbuild: true
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: zip

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # cargo-zigbuild is only needed for cross-compiling Linux arm64.
      - name: Install cargo-zigbuild
        if: matrix.zigbuild
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild

      - name: Build (native)
        if: ${{ !matrix.zigbuild }}
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Build (zigbuild cross-compile)
        if: matrix.zigbuild
        run: cargo zigbuild --release --locked --target ${{ matrix.target }}

      - name: Package (tar.gz)
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          BIN=jobsense-parker
          mkdir -p dist
          cp target/${{ matrix.target }}/release/$BIN dist/
          tar -C dist -czf jobsense-parker-${{ matrix.target }}.tar.gz $BIN

      - name: Package (zip)
        if: matrix.archive == 'zip'
        shell: bash
        run: |
          BIN=jobsense-parker.exe
          mkdir -p dist
          cp target/${{ matrix.target }}/release/$BIN dist/
          cd dist && zip -r ../jobsense-parker-${{ matrix.target }}.zip $BIN

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: jobsense-parker-${{ matrix.target }}.*
          generate_release_notes: true
